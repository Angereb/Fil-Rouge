<div class="hero-scene text-center text-white">

        <h1>Connexion</h1>
    </div>
</div>


<div class="container">
    <form>
        <div class="mb-3">
            <label for="EmailInput" class="form-label">Email :</label>
            <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.fr">
            <div class="invalid-feeedback">
                Le mail ne correspond pas
            </div>
        </div>
        <div class="mb-3">
            <label for="PasswordInput" class="form-label">Mot de Passe :</label>
            <input type="password" class="form-control" id="PasswordInput">
            <div class="invalid-feeedback">
                Le mot de passe ne correspond pas
            </div>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary" id="btnconnecter">Connexion</button>
        </div>
    </form>
    <div class="text-center pt-3">
        <a href="/sinscrire">Vous n'avez pas de compte ? Inscirvez-vous ici !</a>
    </div>
